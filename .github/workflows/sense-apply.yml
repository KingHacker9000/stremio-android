name: Apply Stremio Sense Android MVP
on:
  push:
    branches: [sense-mvp]
permissions:
  contents: write
jobs:
  apply-build:
    if: github.event.head_commit.message == 'Apply Stremio Sense Android MVP'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Sense Android patch
        run: python .sense/apply.py .
      - name: Remove patch kit
        run: rm -rf .sense .github/workflows/sense-apply.yml
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Commit validated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Stremio Sense Android MVP'
          git push origin HEAD:sense-mvp
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stremio-sense-android-debug
          path: app/build/outputs/apk/debug/*.apk
