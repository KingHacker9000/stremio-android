name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - sense-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-stream-server:
    name: Prepare verified stream-server JNI
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned upstream Android release
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/stremio-native/stremio-android/releases/download/v1.2.4/StremioMobile-v1.2.4-universal-release.apk'
          expected='2ec36acb9618b4eec61e6bff2e5b7ab7d0edbb316f4e9dbe7c9f64362349349e'
          curl --fail --location --retry 4 --retry-delay 2 "$url" --output upstream.apk
          echo "$expected  upstream.apk" | sha256sum --check --strict

      - name: Extract only stream-server JNI libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q upstream.apk \
            'lib/armeabi-v7a/libstream_server.so' \
            'lib/arm64-v8a/libstream_server.so' \
            'lib/x86/libstream_server.so' \
            'lib/x86_64/libstream_server.so' \
            -d extracted
          mkdir -p jniLibs
          cp -a extracted/lib/. jniLibs/
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "jniLibs/${abi}/libstream_server.so"
            file "jniLibs/${abi}/libstream_server.so"
          done

      - name: Upload verified JNI libraries
        uses: actions/upload-artifact@v4
        with:
          name: stream-server-jni
          path: jniLibs/
          if-no-files-found: error

  build:
    name: Build Debug APK with JNI
    runs-on: ubuntu-latest
    needs: prepare-stream-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download stream-server JNI libraries
        uses: actions/download-artifact@v4
        with:
          name: stream-server-jni
          path: app/src/main/jniLibs/

      - name: Verify JNI inputs
        shell: bash
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            lib="app/src/main/jniLibs/${abi}/libstream_server.so"
            test -s "$lib"
            echo "$abi: $(stat -c '%s bytes' "$lib")"
          done

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile, test and assemble debug
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin :app:assembleDebug --warning-mode all

      - name: Verify debug APK outputs
        run: python .github/scripts/verify-apk-outputs.py app/build/outputs/apk/debug armeabi-v7a arm64-v8a x86 x86_64 universal

      - name: Verify stream-server is packaged in universal APK
        shell: bash
        run: |
          set -euo pipefail
          universal=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*universal*.apk' -print -quit)
          test -n "$universal"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -l "$universal" | grep -q "lib/${abi}/libstream_server.so"
          done
          echo "Verified libstream_server.so for all ABIs in $universal"
          unzip -l "$universal" | grep 'libstream_server.so'

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: stremio-sense-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
